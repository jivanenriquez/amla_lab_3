[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "amla_lab_3"
version = "0.0.1"
description = "lol"
authors = [
  { name = "jiv" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
dependencies = [
    "jupyterlab==4.6.1",
    "mkdocs",
    "pandas==2.2.2",
    "pip",
    "python-dotenv",
    "ruff",
    "scikit-learn==1.6.1",
]
requires-python = "~=3.14.0"


[tool.ruff]
line-length = 99
src = ["amla_lab_3"]
include = ["pyproject.toml", "amla_lab_3/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["amla_lab_3"]
force-sort-within-sections = true

